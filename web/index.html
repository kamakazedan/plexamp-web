<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="plexamp-web" />
    <meta name="description" content="A web player for your Plex music library." />
    <title>plexamp-web</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="no-player">
    <div id="backdrop" aria-hidden="true">
      <div class="ub on"></div>
      <div class="ub"></div>
      <div class="ub-shade"></div>
    </div>
    <div id="banner" role="alert" hidden></div>
    <nav id="tabs" aria-label="Main"></nav>
    <main id="main"></main>
    <div id="player-bar"></div>
    <div id="overlay-root"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript><p class="noscript">This player needs JavaScript turned on.</p></noscript>
  </body>
</html>
