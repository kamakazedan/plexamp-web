# plexamp-web with Docker Compose, or as a Portainer stack.
#
# Every setting is optional: empty means its default (or off). Each one in
# detail: docs/configuration.md. To build from this folder instead of using
# the published image, replace the image line with:  build: .

services:
  plexamp-web:
    image: ghcr.io/kamakazedan/plexamp-web:latest
    container_name: plexamp-web
    ports:
      - "8080:80"
    environment:
      # Your Plex server's address on your network. Recommended.
      # e.g. http://192.168.1.10:32400
      PLEX_SERVER_URL: ""
      # Live updates: auto (default), on (WebSockets only) or off.
      WEBSOCKETS: ""
      # AI playlists and the AI DJ: an Ollama server everyone shares, and its
      # model. e.g. http://192.168.1.20:11434 and llama3.1:8b
      # (Ollama on this machine: http://host.docker.internal:11434)
      OLLAMA_URL: ""
      OLLAMA_MODEL: ""
      # Who can use it: plex (people signed in with Plex) or off (anyone).
      OLLAMA_AUTH: "plex"
      # Check AI suggestions on MusicBrainz: https://musicbrainz.org, or your
      # own mirror, e.g. http://192.168.1.30:5000. Empty: never.
      MUSICBRAINZ_URL: ""
      # true: the MusicBrainz features (missing albums, original years, years
      # and genres to fix). Best with your own mirror.
      MUSICBRAINZ_ADVANCED: ""
      # false turns each one off.
      PLAY_TOGETHER: "true"        # listening in sync with Plex friends
      CASTING: "true"              # Play on Plex players (server owner)
      PLAYLIST_SHARING: "true"     # sharing playlists with Plex friends
      SYNC_SETTINGS: "true"        # app settings follow each Plex account
      SYNC_MISSING_TRACKS: "true"  # Missing tracks follow each account
      # Playlists from Spotify's download of your data. Empty: on.
      SPOTIFY_FILE_IMPORT: ""
      # true: a playlist from a public Spotify link (first 100 tracks; against
      # Spotify's terms). Empty: off.
      SPOTIFY_LINK_IMPORT: ""
      # Where the offline password (OFFLINE_PWD, below) works from: private
      # (default), any, or networks, e.g. 192.168.1.0/24.
      # OFFLINE_NETWORKS: "private"
      # true: extra detail in the log, tokens removed. Turn it off after.
      DEBUG: ""
    # Secrets go in a file of their own beside this one, readable by you alone
    # (chmod 600), one per line, and never in environment: above (which would
    # win). For example:
    #   OFFLINE_PWD=...     sign in as the server's owner while plex.tv is down
    #                       (read "Offline mode" in docs/configuration.md first;
    #                       openssl rand -base64 24 makes one)
    #   OLLAMA_API_KEY=...  for an Ollama behind a proxy that asks for one
    # env_file: plexamp-web.env
    volumes:
      # Shared playlists, account settings, Missing tracks, MusicBrainz answers.
      - plexamp-web-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  plexamp-web-data:
