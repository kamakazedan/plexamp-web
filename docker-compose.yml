services:
  plexamp-web:
    image: ghcr.io/kamakazedan/plexamp-web:latest
    # To build from this folder instead of pulling the published image:
    # build: .
    container_name: plexamp-web
    ports:
      - "8080:80"
    environment:
      # Optional. Set to your server's LAN address (e.g. http://192.168.1.10:32400)
      # to reach it through this container instead of directly from the browser.
      PLEX_SERVER_URL: ""
    restart: unless-stopped
