# plexamp-web with Docker Compose, or as a Portainer stack.
#
# Every setting is optional: empty means off, or the default. In detail:
# docs/configuration.md.
#
#   PLEX_SERVER_URL     Your Plex server's address on your network, such as
#                       http://192.168.1.10:32400. Browsers that can't reach
#                       Plex directly go through this container instead.
#   DISABLE_WEBSOCKETS  "true": live updates never use WebSockets (for
#                       networks that block them).
#   OLLAMA_URL          An Ollama server whose model everyone using the player
#                       shares, such as http://192.168.1.20:11434, or
#                       http://host.docker.internal:11434 for Ollama on this
#                       machine (extra_hosts below makes that name work).
#   OLLAMA_MODEL        The one model it uses, such as llama3.1:8b.
#   OLLAMA_AUTH         "plex": people signed in with Plex (with
#                       PLEX_SERVER_URL set, only those who can use your
#                       server). "off": anyone who can open the player.
#   MUSICBRAINZ_URL     Checks that an AI playlist's suggestions are real
#                       songs. Unset, nothing goes to MusicBrainz. With
#                       https://musicbrainz.org the suggested names go there
#                       (no account needed); your own mirror, such as
#                       http://192.168.1.30:5000, keeps them on your network.
#   PLAY_TOGETHER       "false" turns off listening in sync with Plex friends.
#   CASTING             "false" turns off Play on (other Plex players on your
#                       network, for your server's owner: needs PLEX_SERVER_URL).
#   PLAYLIST_SHARING    "false" turns off sharing playlists with Plex friends.
#   SYNC_SETTINGS       "false" turns off keeping each Plex account's settings
#                       here, so they follow it to every browser it signs in on.
#   SYNC_MISSING_TRACKS "false" turns off keeping each Plex account's Missing
#                       tracks here (the server's owner's, and friends' who
#                       choose to), so they follow it to every browser, and
#                       the owner sees friends'.
#   SPOTIFY_FILE_IMPORT "true": Search › From Spotify makes playlists from
#                       Spotify's download of your data, read in the browser.
#                       Off unless set, for now.
#   SPOTIFY_LINK_IMPORT "true": Search › From Spotify makes a playlist from a
#                       public Spotify playlist's link, with the tracks you
#                       have. Off unless set: it reads Spotify's public
#                       page for the playlist (the first 100 tracks), which
#                       Spotify's terms don't allow, and which can stop
#                       working. (SPOTIFY_IMPORT, its old name, still works.)
#   DEBUG               "true" writes extra detail to the log, with tokens and
#                       keys removed. Turn it off when you're done.
#
# Shared playlists and each account's settings are kept in /data: the volume
# below, or a folder of your own (./plexamp-web-data:/data). To build from this folder instead of using
# the published image, replace the image line with:  build: .

services:
  plexamp-web:
    image: ghcr.io/kamakazedan/plexamp-web:latest
    container_name: plexamp-web
    ports:
      - "8080:80"
    environment:
      PLEX_SERVER_URL: ""
      DISABLE_WEBSOCKETS: ""
      OLLAMA_URL: ""
      OLLAMA_MODEL: ""
      OLLAMA_AUTH: "plex"
      # MUSICBRAINZ_URL: "https://musicbrainz.org"
      PLAY_TOGETHER: "true"
      CASTING: "true"
      PLAYLIST_SHARING: "true"
      SYNC_SETTINGS: "true"
      SYNC_MISSING_TRACKS: "true"
      SPOTIFY_FILE_IMPORT: ""
      SPOTIFY_LINK_IMPORT: ""
      DEBUG: ""
    volumes:
      - plexamp-web-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  plexamp-web-data:
