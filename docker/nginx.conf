# Upgrade WebSocket requests passed through to Plex at /pms/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Everything after /pms (path and query string), passed to Plex untouched.
map $request_uri $pms_path {
    "~^/pms(/.*)$" $1;
    default        /;
}

# The AI proxy checks the token the app uses for its Plex server, falling
# back to the account token, and rate-limits each signed-in user.
map $http_x_plex_server_token $ai_server_token {
    ''      $http_x_plex_token;
    default $http_x_plex_server_token;
}
map $http_x_plex_token $ai_limit_key {
    ''      $binary_remote_addr;
    default $http_x_plex_token;
}
limit_req_zone $ai_limit_key zone=ai:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Revalidate everything so a new image shows up without a hard refresh.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Plex and Ollama servers can live at any address, so connections (including
    # WebSockets), artwork and audio are allowed from anywhere; scripts only from
    # here and the hls.js CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src * ws: wss:; img-src * data: blob:; media-src * data: blob:; worker-src 'self' blob:; style-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Both written at start-up by /docker-entrypoint.d/40-plexamp-web.sh:
    # the Plex proxy (PLEX_SERVER_URL) and the Ollama proxy (OLLAMA_URL).
    include /etc/nginx/conf.d/pms-proxy.inc;
    include /etc/nginx/conf.d/ai-proxy.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
