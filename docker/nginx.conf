server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Revalidate everything so a new image shows up without a hard refresh.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Plex servers can live at any address, so connections, artwork and audio
    # are allowed from anywhere; scripts only from here and the hls.js CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src *; img-src * data: blob:; media-src * data: blob:; worker-src 'self' blob:; style-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Written at start-up from PLEX_SERVER_URL; empty when it isn't set.
    include /etc/nginx/conf.d/pms-proxy.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
