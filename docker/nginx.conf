# WebSocket requests passed through to Plex at /pms/ are upgraded; nothing
# else is (no other protocol a client asks to switch to reaches Plex).
map $http_upgrade $connection_upgrade {
    default        '';
    "~*^websocket$" upgrade;
}
map $http_upgrade $pw_upgrade {
    default        '';
    "~*^websocket$" websocket;
}

# Everything after /pms (path and query string), passed to Plex untouched.
map $request_uri $pms_path {
    "~^/pms(/.*)$" $1;
    default        /;
}

# The same, normalised (no "..", no escapes), for converted streams' session
# files, which pass without a token.
map $uri $pms_uri {
    "~^/pms(?<pw_su>/.*)$" $pw_su;
    default /;
}

# Requests to Plex carry a token in the query string or a header; the /pms/
# proxy refuses requests without one.
map $args $pms_query_token {
    "~(^|&)X-Plex-Token=(?<pw_qt>[^&]+)" $pw_qt;
    default "";
}
map "$pms_query_token$http_x_plex_token" $pms_has_token {
    ""      0;
    default 1;
}
# ...and the token alone, for the service's check of a request to /pms/
# (see 40-plexamp-web.sh), so nothing else of the request (what's searched
# for, a playlist's name) goes to the service: from $request_uri, as the
# check's own $args is empty (it's a subrequest). The query string's first
# X-Plex-Token, as the service read it before 0.22.0 (an empty one is
# refused), and never one in the path.
map $request_uri $pms_auth_token {
    "~^[^?]*\?(?:[^&]*&)*?X-Plex-Token=(?<pw_at>[^&]*)" $pw_at;
    default "";
}

# Where the Plex server lets the container in without signing in, a request
# to /pms/ goes through for anyone but its owner only with the one sign-in
# the service checked, and nothing Plex might read as another (see pmsToken
# in server/index.js): how often a token's name could be in it ("token", in
# any case or with %-escapes, anywhere in it: 3 is three or more), and
# whether it's to Plex's own /security/token, whose path has one.
map $request_uri $pms_tokenish {
    "~*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e).*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e).*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e)" 3;
    "~*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e).*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e)" 2;
    "~*(?:t|%74|%54)(?:o|%6f|%4f)(?:k|%6b|%4b)(?:e|%65|%45)(?:n|%6e|%4e)" 1;
    default 0;
}
map $request_uri $pms_token_path {
    "~^/pms/security/token(?:\?|$)" 1;
    default 0;
}
# ...and whether it asks for a stream (a WebSocket, or an event stream),
# which stays open for hours.
map $http_accept $pms_event_stream {
    "~*text/event-stream" events;
    default "";
}

# The AI proxy rate-limits each signed-in user, and each address (made-up
# tokens are each a user of their own).
map $http_x_plex_token $ai_limit_key {
    ''      $binary_remote_addr;
    default $http_x_plex_token;
}
limit_req_zone $ai_limit_key zone=ai:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ai_ip:1m rate=120r/m;

# Artwork from Plex can be kept by the browser for a day (its address names
# the picture and its size), so pages put aside get their pictures back
# without fetching them again. Nothing else from Plex, the service or the
# AI proxy is kept at all (it's yours, and its address has your token in
# it); the app's own files are checked every time.
map $uri $pw_cache_control {
    "~^/pms/photo/:/transcode$" "private, max-age=86400";
    "~^/(pms|api|ollama)/"      "no-store";
    default "no-cache";
}

# Signing out (see signOut in web/js/state.js) asks the browser to forget
# what it kept from here: artwork, whose addresses have the token in them.
# (Browsers only do this over HTTPS.)
map $uri $pw_clear_site_data {
    /signed-out '"cache"';
    default     '';
}

# Request paths without query strings, for the debug-mode access log: Plex
# tokens travel in query strings, so those are never logged.
map $request_uri $pw_log_path {
    "~^(?<pw_lp>[^?]*)" $pw_lp;
    default "-";
}
log_format pw_debug '$remote_addr "$request_method $pw_log_path" $status ${body_bytes_sent}B ${request_time}s upstream:$upstream_status';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # (What's kept, and for how long: see $pw_cache_control above. The app's
    # own files are checked each time, so a new version shows up without a
    # hard refresh.)
    add_header Cache-Control $pw_cache_control always;
    add_header Clear-Site-Data $pw_clear_site_data always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Plex and Ollama servers can live at any address, so connections (including
    # WebSockets), artwork and audio are allowed from anywhere; scripts and
    # styles only from this container.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src * ws: wss:; img-src * data: blob:; media-src * data: blob:; worker-src 'self' blob:; style-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Written at start-up by /docker-entrypoint.d/40-plexamp-web.sh: logging
    # (DEBUG), the Plex proxy (PLEX_SERVER_URL), the Ollama proxy
    # (OLLAMA_URL) and the service behind /api/ (Play Together, sign-in checks).
    include /etc/nginx/conf.d/log.inc;
    include /etc/nginx/conf.d/pms-proxy.inc;
    include /etc/nginx/conf.d/ai-proxy.inc;
    include /etc/nginx/conf.d/api.inc;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /signed-out {
        return 204;
    }

    # Nothing in the app's folder whose name starts with a dot.
    location ~ "^/(?!pms/|api/|ollama/)(?:[^/]*/)*\." {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
