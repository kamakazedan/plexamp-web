name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Each job gets only what it needs (see image, publish and stable below).
# Actions are pinned to the commits of the versions named beside them, the
# images they run to digests, and the runners to Ubuntu 24.04 (ubuntu-latest
# moves to 26.04 from October 2026, where Playwright 1.56 can't install its
# browser's dependencies).
permissions:
  contents: read

# One run at a time for each branch or tag: a newer push to main waits for
# the one before (and the newest waiting replaces any older), so what's
# published never goes back to an older commit. A pull request's older run
# is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in web/js/*.js web/js/views/*.js server/*.js; do
            node --experimental-default-type=module --check "$f"
          done
      - name: Check the version matches the changelog
        run: |
          app="$(sed -n "s/^export const APP_INFO = .*version: '\([0-9.]*\)'.*/\1/p" web/js/plex.js)"
          log="$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md | head -n 1)"
          echo "app $app, changelog $log"
          [ -n "$app" ] && [ "$app" = "$log" ] || { echo "APP_INFO.version in web/js/plex.js must match the newest CHANGELOG.md entry"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $app"
            exit 1
          fi
      - name: Test the service (sessions, sync, cleaning, redaction)
        run: node --test server/test.js
      - name: Check scripts
        run: |
          sh -n docker/40-plexamp-web.sh
          sh -n docker/test-container.sh
          sh -n tests/run-browser-tests.sh
          sh -n dev/fetch-hls.sh
          python3 -m py_compile dev/mock-plex.py dev/mock-ollama.py tests/browser_test.py
      - name: Check the shell scripts, and the Proxmox scripts' own tests
        shell: bash # with pipefail, so shellcheck's findings fail the step
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          # A known shellcheck, checked against its checksum, rather than
          # whichever the runner has (unless it can't be downloaded).
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          if curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"; then
            echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c --quiet - || { echo "::error title=shellcheck::the download didn't match its checksum"; exit 1; }
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            PATH="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION:$PATH"
          else
            echo "::warning title=shellcheck::$SHELLCHECK_VERSION couldn't be downloaded, so the runner's own is used"
          fi
          echo "::notice title=shellcheck::$(shellcheck --version | sed -n 2p)"
          # What shellcheck finds is also an annotation on the run's summary page.
          lint() { shellcheck -f gcc "$@" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::error file=\1,line=\2,col=\3::\4: \5/'; }
          status=0
          lint proxmox/plexamp-web.sh proxmox/install.sh tests/proxmox-install-test.sh docker/40-plexamp-web.sh || status=1
          lint --severity=warning tests/proxmox-test.sh docker/test-container.sh tests/run-browser-tests.sh dev/fetch-hls.sh || status=1
          bash tests/proxmox-test.sh || status=1
          exit "$status"
      - name: Test the Proxmox install (in Debian 12 and 13)
        run: bash tests/proxmox-install-test.sh

  # The image is built once, for both platforms, and what's published is
  # that very build, once it's passed: pushed to a staging tag, tested by its
  # digest (amd64 in full, arm64 started under emulation), then given its
  # tags (see publish). A pull request's is built for amd64 alone, and
  # tested, not pushed.
  image:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write # to push the build to its staging tag (never for pull requests)
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Name the image, and read the version
        id: name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "IMAGE=$image" >>"$GITHUB_ENV"
          echo "version=$(sed -n "s/^export const APP_INFO = .*version: '\([0-9.]*\)'.*/\1/p" web/js/plex.js)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta # (the image's labels)
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ steps.name.outputs.version }}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'plexamp-web:test' || format('{0}:staging', steps.name.outputs.image) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Get the build just pushed, by its digest, to test it
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" plexamp-web:test
          [ "$(docker image inspect -f '{{.Architecture}}' plexamp-web:test)" = amd64 ]
      - name: Test the container (proxies, sign-in check, settings)
        run: sh docker/test-container.sh plexamp-web:test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: sh tests/run-browser-tests.sh plexamp-web:test screenshots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the arm64 build starts, and its parts answer (under emulation)
        if: github.event_name != 'pull_request'
        shell: bash # with pipefail
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The build's own arm64 image, by its own digest: Docker keeps one
          # image for each digest, and the build's is amd64's here already.
          arm64="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw |
            jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else empty end')"
          [ -n "$arm64" ] || { echo "::error title=arm64::the build hasn't one linux/arm64 image"; exit 1; }
          docker pull --platform linux/arm64 "$IMAGE@$arm64"
          docker tag "$IMAGE@$arm64" plexamp-web:arm64
          [ "$(docker image inspect -f '{{.Architecture}}' plexamp-web:arm64)" = arm64 ]
          sh docker/test-container.sh plexamp-web:arm64 --smoke

  # The tested build, given its tags as it is (not built again): latest and
  # the version's number only while it's still the newest commit on main
  # (an older run that finished later never moves them back).
  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # to tag the image
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Is this still the newest commit on main?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          newest=false
          if [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF#refs/heads/}" --jq .sha)"
            if [ "$tip" = "$GITHUB_SHA" ]; then
              newest=true
            else
              echo "::notice title=Not the newest::main is at $tip now, so latest and the version's tag are left to that run"
            fi
          fi
          echo "newest=$newest" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false # (latest only as below: not for a tag pushed)
          tags: |
            type=raw,value=latest,enable=${{ steps.newest.outputs.newest }}
            type=raw,value=${{ needs.image.outputs.version }},enable=${{ steps.newest.outputs.newest }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Tag the tested build
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "No tags to give it"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          # Each tag is that very build.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$tag: $got"
            [ "$got" = "$DIGEST" ] || { echo "::error title=Publish::$tag is $got, not the tested $DIGEST"; exit 1; }
          done <<<"$TAGS"

  # The Proxmox install (proxmox/install.sh) and its updates take the app
  # from this branch: the newest commit that passed every test, as the image
  # just published was. A job of its own, as it's the only one that can
  # change the repository. Only forward: a push that isn't a fast-forward is
  # refused, and it isn't moved at all once main has moved on.
  stable:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # to move the stable branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # (so git can tell the push is a fast-forward)
      - name: Move the stable branch here
        run: |
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice title=Not the newest::main is at $tip now, so stable is left to that run"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/stable"
