name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in web/js/*.js web/js/views/*.js server/*.js; do
            node --experimental-default-type=module --check "$f"
          done
      - name: Check the version matches the changelog
        run: |
          app="$(sed -n "s/^export const APP_INFO = .*version: '\([0-9.]*\)'.*/\1/p" web/js/plex.js)"
          log="$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md | head -n 1)"
          echo "app $app, changelog $log"
          [ -n "$app" ] && [ "$app" = "$log" ] || { echo "APP_INFO.version in web/js/plex.js must match the newest CHANGELOG.md entry"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $app"
            exit 1
          fi
      - name: Test the service (sessions, sync, cleaning, redaction)
        run: node --test server/test.js
      - name: Check scripts
        run: |
          sh -n docker/40-plexamp-web.sh
          sh -n docker/test-container.sh
          sh -n tests/run-browser-tests.sh
          sh -n dev/fetch-hls.sh
          python3 -m py_compile dev/mock-plex.py dev/mock-ollama.py tests/browser_test.py
      - name: Check the Proxmox scripts
        shell: bash # with pipefail, so shellcheck's findings fail the step
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          # A known shellcheck rather than whichever the runner has (when it
          # can be downloaded).
          if curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"; then
            PATH="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION:$PATH"
          fi
          echo "::notice title=shellcheck::$(shellcheck --version | sed -n 2p)"
          # What shellcheck finds is also an annotation on the run's summary page.
          lint() { shellcheck -f gcc "$@" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): ([a-z]+): (.*)$/::error file=\1,line=\2,col=\3::\4: \5/'; }
          status=0
          lint proxmox/plexamp-web.sh proxmox/install.sh tests/proxmox-install-test.sh docker/40-plexamp-web.sh || status=1
          lint --severity=warning tests/proxmox-test.sh docker/test-container.sh || status=1
          bash tests/proxmox-test.sh || status=1
          exit "$status"
      - name: Test the Proxmox install (in Debian 12 and 13)
        run: bash tests/proxmox-install-test.sh
      - name: Build the image
        run: docker build -t plexamp-web:test .
      - name: Test the container (proxies, sign-in check, settings)
        run: sh docker/test-container.sh plexamp-web:test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: sh tests/run-browser-tests.sh plexamp-web:test screenshots
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to move the stable branch (see the last step)
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          echo "app=$(sed -n "s/^export const APP_INFO = .*version: '\([0-9.]*\)'.*/\1/p" web/js/plex.js)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.app }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Proxmox install (proxmox/install.sh) and its updates take the app
      # from this branch: the newest commit that passed every test, as the
      # image just published was.
      - name: Move the stable branch here
        if: github.ref == 'refs/heads/main'
        run: git push --force origin "HEAD:refs/heads/stable"
